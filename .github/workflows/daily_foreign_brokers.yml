name: Daily foreign broker snapshot

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "scripts/snapshot_foreign_brokers.py"
      - ".github/workflows/daily_foreign_brokers.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pandas
      - run: python scripts/snapshot_foreign_brokers.py
      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foreign_broker_history.csv
          git diff --cached --quiet || git commit -m "Update daily foreign broker history"
          git pull --rebase origin main
          git push origin HEAD:main
